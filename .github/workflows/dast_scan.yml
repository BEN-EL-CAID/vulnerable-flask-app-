
name: DAST Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker Network
        run: docker network create zap-network

      - name: Build Flask Docker image
        run: docker build -t my-vulnerable-flask-app .

      - name: Run Flask Docker container
        run: |
          docker run -d \
            --name flask-app-container \
            -p 5000:5000 \
            --network zap-network \
            my-vulnerable-flask-app

      - name: Wait for app to start
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:5000/; then
              echo "Flask app is ready"
              exit 0
            fi
            sleep 2
          done

          docker logs flask-app-container
          exit 1

      - name: Create ZAP reports directory
        run: mkdir -p "${{ github.workspace }}/zap_reports"

      - name: Set ZAP reports directory permissions
        run: chmod 777 "${{ github.workspace }}/zap_reports"

      - name: Run OWASP ZAP Full Scan
        run: |
          docker run --rm \
            --network zap-network \
            -v "${{ github.workspace }}/zap_reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://flask-app-container:5000 \
            -I -j \
            -r report.html \
            -J report.json \
            -x report.xml \
            -a

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: ${{ github.workspace }}/zap_reports/
          if-no-files-found: warn
          retention-days: 5

      - name: Stop Flask Docker container
        if: always()
        run: docker rm -f flask-app-container || true
